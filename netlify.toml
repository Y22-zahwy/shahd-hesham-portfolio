# Netlify build settings for the Next.js App Router site.
# The official Next.js runtime plugin below is required (SSR, image optimization, routing).
[build]
  command = "npm run build"
  publish = ".next"

# Official Netlify runtime for Next.js (SSR, image optimization, routing).
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Long-lived caching for the extracted portfolio artwork.
[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
