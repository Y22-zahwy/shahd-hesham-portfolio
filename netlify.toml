# Netlify build settings for the Next.js App Router site.
# Netlify detects Next.js and applies its official Next.js runtime automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Long-lived caching for the extracted portfolio artwork.
[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
